<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>HandwerkPilot registrieren</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#eef2f6;color:#142033;padding:18px}.box{max-width:520px;margin:20px auto;background:#fff;border-radius:26px;padding:24px;box-shadow:0 12px 30px rgba(15,23,42,.08)}.brand{display:flex;align-items:center;gap:12px;font-weight:900;font-size:28px;margin-bottom:12px}.mark{width:56px;height:56px;border-radius:16px;background:#0f172a;color:white;display:grid;place-items:center;font-weight:950}.sub{color:#667085;margin:0 0 22px}label{display:block;font-weight:800;margin:14px 0 7px}input{width:100%;box-sizing:border-box;border:1px solid #dbe2ea;border-radius:14px;padding:14px;font-size:17px;background:#fff}.btn{width:100%;border:0;border-radius:16px;background:#0f172a;color:white;font-weight:900;font-size:18px;padding:16px;margin-top:20px}.hint{color:#667085;line-height:1.45;font-size:14px;margin-top:16px}.back{display:block;text-align:center;margin-top:16px;color:#2563eb;text-decoration:none;font-weight:700}</style></head><body><div class="box"><div class="brand"><div class="mark">HP</div><div>HandwerkPilot</div></div><h1>Betrieb registrieren</h1><p class="sub">14 Tage kostenlos testen. Danach 29,90 € pro Monat.</p><form method="POST" action="/api/register" enctype="application/x-www-form-urlencoded"><label>Firmenname</label><input name="company" required autocomplete="organization"><label>Vor- und Nachname</label><input name="name" required autocomplete="name"><label>E-Mail</label><input name="email" type="email" required autocomplete="email"><label>Passwort</label><input name="password" type="password" minlength="6" required autocomplete="new-password"><button class="btn" type="submit">14 Tage kostenlos starten</button></form><p class="hint">Die Registrierung wird direkt an den HandwerkPilot-Server gesendet. Diese Seite verwendet dafür keinen JavaScript-Netzwerkaufruf.</p><a class="back" href="/">Zurück zur Anmeldung</a></div></body></html>

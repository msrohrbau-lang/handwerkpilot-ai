<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>HandwerkPilot</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#eef2f6;color:#142033;padding:18px}.box{max-width:520px;margin:20px auto;background:#fff;border-radius:26px;padding:24px;box-shadow:0 12px 30px rgba(15,23,42,.08)}.brand{display:flex;align-items:center;gap:12px;font-weight:900;font-size:28px;margin-bottom:12px}.mark{width:56px;height:56px;border-radius:16px;background:#0f172a;color:#fff;display:grid;place-items:center;font-weight:950}.sub{color:#667085;margin:0 0 22px;line-height:1.45}label{display:block;font-weight:800;margin:14px 0 7px}input{width:100%;box-sizing:border-box;border:1px solid #dbe2ea;border-radius:14px;padding:14px;font-size:17px}.btn{width:100%;border:0;border-radius:16px;background:#0f172a;color:#fff;font-weight:900;font-size:18px;padding:16px;margin-top:20px}.hint{color:#667085;line-height:1.45;font-size:14px;margin-top:16px}.back{display:block;text-align:center;margin-top:16px;color:#2563eb;text-decoration:none;font-weight:700}.hidden{display:none!important}.status{margin-top:14px;font-weight:700;line-height:1.4}.err{color:#b42318}</style></head><body><div class="box"><div class="brand"><div class="mark">HP</div><div>HandwerkPilot</div></div><section id="registerView"><h1 id="registerTitle">Betrieb registrieren</h1><p class="sub" id="registerSub">14 Tage kostenlos testen. Danach 29,90 € pro Monat.</p><form method="POST" action="/api/register"><input type="hidden" name="invite" id="inviteToken"><div id="companyField"><label>Firmenname</label><input name="company" id="companyInput" required></div><label>Vor- und Nachname</label><input name="name" required autocomplete="name"><div id="emailField"><label>E-Mail</label><input name="email" id="emailInput" type="email" required autocomplete="email"></div><div id="phoneField" class="hidden"><label>Handynummer</label><input name="phone" id="phoneInput" type="tel" autocomplete="tel" placeholder="z. B. 0171 1234567"></div><label>Passwort</label><input name="password" type="password" minlength="6" required autocomplete="new-password"><button class="btn" id="registerButton" type="submit">14 Tage kostenlos starten</button></form><p class="hint" id="registerHint">Die Registrierung wird direkt an den HandwerkPilot-Server gesendet.</p><div id="registerError" class="status err"></div><a class="back" href="/login">Zur Anmeldung</a></section></div><script>(function(){const q=new URLSearchParams(location.search),invite=q.get('invite')||'',err=q.get('register_error')||'';if(err)document.getElementById('registerError').textContent=err;if(invite){document.getElementById('inviteToken').value=invite;document.getElementById('companyField').classList.add('hidden');document.getElementById('companyInput').required=false;document.getElementById('emailField').classList.add('hidden');document.getElementById('emailInput').required=false;document.getElementById('phoneField').classList.remove('hidden');document.getElementById('phoneInput').required=true;document.getElementById('registerTitle').textContent='Mitarbeiterkonto erstellen';document.getElementById('registerSub').textContent='Du wurdest zu einem HandwerkPilot-Betrieb eingeladen.';document.getElementById('registerButton').textContent='Einladung annehmen';document.getElementById('registerHint').textContent='Du brauchst keine E-Mail-Adresse. Später meldest du dich mit Handynummer und Passwort an.'}})();</script></body></html>

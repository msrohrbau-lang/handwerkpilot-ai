<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Konto & Abo – HandwerkPilot</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f3f5f7;color:#142033}.wrap{max-width:620px;margin:50px auto;padding:0 18px}.card{background:#fff;border-radius:24px;padding:24px;box-shadow:0 8px 26px rgba(15,23,42,.08)}.brand{font-size:22px;font-weight:950;margin-bottom:20px}.btn{border:0;border-radius:13px;padding:13px 15px;font-weight:850;cursor:pointer;width:100%;margin-top:10px}.primary{background:#0f172a;color:white}.blue{background:#2563eb;color:white}.secondary{background:#eef2f6;color:#142033}.status{font-size:13px;color:#667085;margin-top:12px;line-height:1.5}input{width:100%;border:1px solid #dbe2ea;border-radius:13px;padding:12px;margin-top:6px}label{display:block;font-size:13px;font-weight:800;margin-top:10px}.links{text-align:center;margin-top:22px;font-size:13px}.links a{color:#667085;margin:0 7px}</style></head><body><div class="wrap"><div class="card"><div class="brand">HP · HandwerkPilot</div><h1>Konto & Abo</h1><div id="loggedOut"><p>Melde dich an, um dein HandwerkPilot-Pro-Abo zu verwalten oder zu kündigen.</p><label>E-Mail</label><input id="email" type="email"><label>Passwort</label><input id="password" type="password"><button class="btn primary" onclick="login()">Anmelden</button></div><div id="loggedIn" style="display:none"><p id="user"></p><button class="btn blue" onclick="openPortal()">Abo verwalten / kündigen</button><button class="btn secondary" onclick="backToApp()">Zurück zu HandwerkPilot</button><button class="btn secondary" onclick="logout()">Abmelden</button></div><div id="status" class="status"></div></div><div class="links"><a href="/impressum.html">Impressum</a><a href="/datenschutz.html">Datenschutz</a><a href="/agb.html">AGB</a></div></div><script>let sb,session;const $=id=>document.getElementById(id);async function init(){try{const c=await (await fetch('/api/config',{cache:'no-store'})).json();sb=supabase.createClient(c.supabaseUrl,c.supabaseAnonKey);const r=await sb.auth.getSession();session=r.data.session;render()}catch(e){$('status').textContent=e.message}}function render(){const on=!!session;$('loggedOut').style.display=on?'none':'block';$('loggedIn').style.display=on?'block':'none';if(on)$('user').textContent='Angemeldet als '+session.user.email}async function login(){const {data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('status').textContent='Anmeldung fehlgeschlagen: '+error.message;return}session=data.session;$('status').textContent='';render()}async function logout(){await sb.auth.signOut();session=null;render()}function backToApp(){location.href='/login'}async function openPortal(){try{$('status').textContent='Abo-Verwaltung wird geöffnet …';const r=await fetch('/api/portal',{method:'POST',headers:{Authorization:'Bearer '+session.access_token}});const d=await r.json();if(!r.ok||!d.url)throw new Error(d.error||'Abo-Verwaltung konnte nicht geöffnet werden.');location.href=d.url}catch(e){$('status').textContent=e.message}}init();</script></body></html>

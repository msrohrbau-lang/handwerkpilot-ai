<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>HandwerkPilot 2.0 Lexware</title></head><body style="margin:0;background:#f4f6f8"><div id="loading" style="font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif;padding:40px;text-align:center;font-weight:800;color:#142033">HandwerkPilot 2.0 wird geladen …</div><script>
(async()=>{
  try{

    const patch=`<script>
window.addEventListener('load',()=>{
  const navStyle=document.createElement('style');navStyle.textContent='.sheet>.row:first-child{position:sticky;top:-20px;z-index:15;background:#fff;padding:12px 0 10px;border-bottom:1px solid #eef2f6}.hp-home-btn{border:0;border-radius:13px;padding:10px 12px;font-weight:850;background:#0f172a;color:#fff;white-space:nowrap}.sheet>.row:first-child h2{flex:1}.sheet>.row:first-child{align-items:center}';document.head.appendChild(navStyle);
  window.goHpHome=function(){closeModal();showView('home');window.scrollTo({top:0,behavior:'smooth'})};window.addModalHomeButton=function(){const header=document.querySelector('#modal .sheet>.row:first-child');if(!header||header.querySelector('.hp-home-btn'))return;const b=document.createElement('button');b.className='hp-home-btn';b.textContent='← Hauptmenü';b.onclick=goHpHome;header.insertBefore(b,header.firstChild)};
  const baseOpenDoc=openDoc;window.openDoc=function(){baseOpenDoc.apply(this,arguments);setTimeout(addModalHomeButton,0)};const baseOpenCustomer=openCustomer;window.openCustomer=function(){baseOpenCustomer.apply(this,arguments);setTimeout(addModalHomeButton,0)};const baseOpenCustomerFormOriginal=openCustomerForm;
  const book=document.getElementById('wiso');if(book){book.innerHTML=\`<div class="card"><h2 style="margin-top:0">Buchhaltung</h2><p class="tiny">Du arbeitest weiter in HandwerkPilot auf dem Handy. Die fertigen Kunden- und Rechnungsdaten können direkt an deine Buchhaltung übergeben werden.</p><div class="list"><div class="item"><div class="row"><div><strong>Lexware Office</strong><div class="tiny">Erste aktive Schnittstelle · Kunden und Rechnungen</div></div><span class="pill paid">bereit</span></div><label>Lexware API-Key</label><input id="lexwareKey" type="password" autocomplete="off" placeholder="API-Key einmal für diesen Test eingeben"><div class="actions"><button class="btn primary" onclick="saveLexwareKey()">Lexware verbinden</button><button class="btn secondary" onclick="testLexware()">Verbindung testen</button></div><div id="lexwareStatus" class="status"></div><p class="tiny">Testversion: Der Key bleibt nur in dieser Browser-Sitzung und wird beim Schließen des Tabs gelöscht.</p></div></div></div>\`;}
  document.querySelectorAll('.bottom button').forEach(b=>{if(b.textContent.includes('WISO'))b.innerHTML='<span>📚</span>Buchhaltung'});document.querySelectorAll('.tile').forEach(b=>{if(b.textContent.includes('WISO')){b.innerHTML='📚 Buchhaltung<small>Lexware verbinden</small>';b.onclick=()=>showView('wiso')}});
  window.saveLexwareKey=function(){const key=(document.getElementById('lexwareKey')?.value||'').trim();const s=document.getElementById('lexwareStatus');if(!key){s.textContent='Bitte Lexware API-Key eingeben.';return}sessionStorage.setItem('hp_lexware_key',key);s.textContent='API-Key gespeichert. Jetzt Verbindung testen.'};window.lexwareCall=async function(action,payload={}){const key=(document.getElementById('lexwareKey')?.value||sessionStorage.getItem('hp_lexware_key')||'').trim();if(!key)throw new Error('Bitte zuerst Lexware verbinden.');const r=await fetch('/api/lexware',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,lexwareKey:key,...payload})});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||'Lexware-Fehler');return data};window.testLexware=async function(){const s=document.getElementById('lexwareStatus');try{s.textContent='Lexware wird geprüft …';const data=await lexwareCall('profile');s.textContent='✓ Verbunden mit '+(data.profile?.companyName||data.profile?.userEmail||'Lexware Office');s.className='status ok'}catch(e){s.textContent=e.message;s.className='status'}};
  window.openCustomerForm=function(c=null){baseOpenCustomerFormOriginal(c);setTimeout(()=>{addModalHomeButton();document.querySelectorAll('#modalBody button').forEach(b=>{if(b.textContent.includes('WISO')){b.textContent='→ Lexware übertragen';b.onclick=syncCustomerLexware}})},0)};
  window.syncInvoiceLexware=async function(id){try{const doc=documents.find(x=>x.id===id);if(!doc)return;const c=customers.find(x=>x.id===doc.payload?.customer_id)||customers.find(x=>x.name===doc.payload?.customer_name);if(!c)throw new Error('Kunde zur Rechnung wurde nicht gefunden.');await lexwareCall('createInvoice',{customer:{name:c.name,street:c.street,city:c.city,email:c.email},document:{date:doc.payload?.date,subject:doc.payload?.subject,note:doc.payload?.note,positions:(doc.payload?.positions||[]).map(p=>({...p,unit:p.unit||'Stück'})),vat:Number(company.vat??19)},finalize:false});alert('Rechnung wurde als Entwurf an Lexware übertragen.')}catch(e){alert(e.message)}};
  window.convertDoc=async function(id,to){const doc=documents.find(x=>x.id===id);if(!doc)return;const already=documents.find(x=>x.document_type===to&&x.payload?.source_document_id===doc.id);if(already){alert((to==='auftrag'?'Auftrag':'Rechnung')+' wurde aus diesem Vorgang bereits erstellt.');return}const copiedPayload=JSON.parse(JSON.stringify(doc.payload||{}));copiedPayload.source_document_id=doc.id;copiedPayload.source_document_number=doc.document_number||'';copiedPayload.date=new Date().toISOString().slice(0,10);const row={organization_id:profile.organization_id,user_id:session.user.id,document_type:to,document_number:nextNumber(to),title:to==='auftrag'?'Auftrag':'Rechnung',status:to==='rechnung'?'open':'auftrag',payload:copiedPayload,total_net:Number(doc.total_net||0),total_vat:Number(doc.total_vat||0),total_gross:Number(doc.total_gross||0)};const res=await sb.from('documents').insert(row).select().single();if(res.error){alert(res.error.message);return}documents.unshift(res.data);renderDocs();refresh();alert((to==='auftrag'?'Auftrag':'Rechnung')+' erstellt – Positionen und Kundendaten wurden übernommen.')};
  window.openExistingDoc=function(id){const x=documents.find(v=>v.id===id);if(!x)return;const p=x.payload||{};const pos=Array.isArray(p.positions)?p.positions:[];const body='<div class="item"><div class="tiny">Kunde</div><strong>'+esc(p.customer_name||'')+'</strong><div class="tiny" style="margin-top:8px">Datum</div><div>'+esc(p.date||'')+'</div><div class="tiny" style="margin-top:8px">Betreff</div><div>'+esc(p.subject||'')+'</div></div><h3>Positionen</h3><div class="list">'+(pos.length?pos.map(function(z){return '<div class="item"><strong>'+esc(z.desc||'Position')+'</strong><div>'+esc(z.qty||0)+' × '+money(z.price||0)+'</div></div>'}).join(''):'<div class="status">Keine Positionen.</div>')+'</div><div class="sum">'+money(x.total_gross||0)+'</div>'+(p.note?'<div class="item"><div class="tiny">Notiz</div>'+esc(p.note)+'</div>':'')+'<div class="actions">'+(x.document_type==='rechnung'?'<button class="btn blue" onclick="syncInvoiceLexware(\''+x.id+'\')">→ Lexware</button>':'')+'</div>';$('modalTitle').textContent=(x.title||x.document_type)+' '+(x.document_number||'');$('modalBody').innerHTML=body;$('modal').classList.remove('hidden');setTimeout(addModalHomeButton,0)};
  const originalRenderDocs=renderDocs;window.renderDocs=function(){originalRenderDocs();const arr=docFilter==='all'?documents:documents.filter(x=>x.document_type===docFilter);document.getElementById('docList').innerHTML=arr.length?arr.map(function(x){const st=x.document_type==='rechnung'?(x.status==='paid'?'<span class="pill paid">bezahlt</span>':'<span class="pill open">offen</span>'):'<span class="pill">'+esc(x.document_type)+'</span>';let buttons='<button class="btn secondary" onclick="openExistingDoc(\''+x.id+'\')">Öffnen</button>';if(x.document_type==='angebot')buttons+='<button class="btn secondary" onclick="convertDoc(\''+x.id+'\',\'auftrag\')">→ Auftrag</button>';if(x.document_type==='auftrag')buttons+='<button class="btn blue" onclick="convertDoc(\''+x.id+'\',\'rechnung\')">→ Rechnung</button>';if(x.document_type==='rechnung')buttons+='<button class="btn primary" onclick="syncInvoiceLexware(\''+x.id+'\')">→ Lexware</button>';if(x.document_type==='rechnung'&&x.status!=='paid')buttons+='<button class="btn green" onclick="markPaid(\''+x.id+'\')">✓ Bezahlt</button>';return '<div class="item"><div class="row"><div><strong>'+esc(x.title||x.document_type)+' '+esc(x.document_number||'')+'</strong><div class="tiny">'+esc(x.payload?.customer_name||'')+' · '+new Date(x.created_at).toLocaleDateString('de-DE')+'</div><div>'+money(x.total_gross||0)+'</div></div>'+st+'</div><div class="actions">'+buttons+'</div></div>'}).join(''):'<div class="status">Keine Vorgänge.</div>'};
});
</`+`script>`;html=html.replace('</body>',patch+'</body>');document.open();document.write(html);document.close();
  }catch(e){document.getElementById('loading').textContent='Laden fehlgeschlagen: '+e.message}
})();
</script></body></html>

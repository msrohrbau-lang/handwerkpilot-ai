<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>HandwerkPilot 2.0 Lexware</title></head><body style="margin:0;background:#f4f6f8"><div id="loading" style="font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif;padding:40px;text-align:center;font-weight:800;color:#142033">HandwerkPilot 2.0 wird geladen …</div><script>
(async()=>{
  try{
    let html=await (await fetch('/handwerkpilot-2.html?lexware=3',{cache:'no-store'})).text();
    html=html.replace("$('wisoOwnership').value=localStorage.getItem('hp_wiso_ownership')||''","if($('wisoOwnership'))$('wisoOwnership').value=localStorage.getItem('hp_wiso_ownership')||''");
    const patch=`<script>
window.addEventListener('load',()=>{
  const book=document.getElementById('wiso');
  if(book){
    book.innerHTML=\`<div class="card"><h2 style="margin-top:0">Buchhaltung</h2><p class="tiny">Du arbeitest weiter in HandwerkPilot auf dem Handy. Die fertigen Kunden- und Rechnungsdaten können direkt an deine Buchhaltung übergeben werden.</p><div class="list"><div class="item"><div class="row"><div><strong>Lexware Office</strong><div class="tiny">Erste aktive Schnittstelle · Kunden und Rechnungen</div></div><span class="pill paid">bereit</span></div><label>Lexware API-Key</label><input id="lexwareKey" type="password" autocomplete="off" placeholder="API-Key einmal für diesen Test eingeben"><div class="actions"><button class="btn primary" onclick="saveLexwareKey()">Lexware verbinden</button><button class="btn secondary" onclick="testLexware()">Verbindung testen</button></div><div id="lexwareStatus" class="status"></div><p class="tiny">Testversion: Der Key bleibt nur in dieser Browser-Sitzung und wird beim Schließen des Tabs gelöscht. In der Verkaufsversion wird er geschützt serverseitig gespeichert.</p></div><div class="item"><div class="row"><div><strong>WISO MeinBüro</strong><div class="tiny">Als nächste Schnittstelle vorgesehen</div></div><span class="pill">demnächst</span></div></div><div class="item"><div class="row"><div><strong>DATEV</strong><div class="tiny">Übergabe für Steuerberater als nächster Ausbau</div></div><span class="pill">demnächst</span></div></div></div></div><div class="card"><h3 style="margin-top:0">So läuft es später</h3><div class="list"><div class="item">1. Kunde auf dem Handy anlegen</div><div class="item">2. Angebot → Auftrag → Rechnung in HandwerkPilot</div><div class="item">3. Rechnung an Lexware übergeben</div><div class="item">4. Buchhaltung und Steuerberater arbeiten mit den vorbereiteten Daten weiter</div></div></div>\`;
  }

  document.querySelectorAll('.bottom button').forEach(b=>{if(b.textContent.includes('WISO'))b.innerHTML='<span>📚</span>Buchhaltung'});
  document.querySelectorAll('.tile').forEach(b=>{if(b.textContent.includes('WISO')){b.innerHTML='📚 Buchhaltung<small>Lexware verbinden · WISO/DATEV folgen.</small>';b.onclick=()=>showView('wiso')}});

  window.saveLexwareKey=function(){
    const key=(document.getElementById('lexwareKey')?.value||'').trim();
    const s=document.getElementById('lexwareStatus');
    if(!key){s.textContent='Bitte Lexware API-Key eingeben.';return}
    sessionStorage.setItem('hp_lexware_key',key);
    s.textContent='API-Key für diese Sitzung gespeichert. Jetzt Verbindung testen.';
  };

  window.ensureHpSession=async function(){
    try{
      let current=(await sb.auth.getSession()).data.session;
      if(current?.access_token){session=current;return current}
      const refreshed=await sb.auth.refreshSession();
      if(refreshed?.data?.session?.access_token){session=refreshed.data.session;return session}
    }catch(e){}
    sessionStorage.setItem('hp_return_view','wiso');
    const authBox=document.getElementById('auth');
    if(authBox)authBox.classList.remove('hidden');
    const status=document.getElementById('authStatus');
    if(status)status.textContent='Deine Sitzung ist abgelaufen. Bitte einmal neu anmelden – danach kommst du direkt zurück zur Buchhaltung.';
    throw new Error('Bitte HandwerkPilot erneut anmelden.');
  };

  window.lexwareCall=async function(action,payload={}){
    const key=(document.getElementById('lexwareKey')?.value||sessionStorage.getItem('hp_lexware_key')||'').trim();
    if(!key)throw new Error('Bitte zuerst Lexware verbinden.');
    const active=await ensureHpSession();
    let r=await fetch('/api/lexware',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+active.access_token},body:JSON.stringify({action,lexwareKey:key,...payload})});
    if(r.status===401){
      try{
        const refreshed=await sb.auth.refreshSession();
        if(refreshed?.data?.session?.access_token){session=refreshed.data.session;r=await fetch('/api/lexware',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},body:JSON.stringify({action,lexwareKey:key,...payload})})}
      }catch(e){}
    }
    const d=await r.json();
    if(r.status===401){sessionStorage.setItem('hp_return_view','wiso');const authBox=document.getElementById('auth');if(authBox)authBox.classList.remove('hidden');const status=document.getElementById('authStatus');if(status)status.textContent='Bitte einmal neu anmelden – danach kommst du direkt zurück zur Buchhaltung.';throw new Error('HandwerkPilot-Anmeldung ist abgelaufen.')}
    if(!r.ok)throw new Error(d.error||'Lexware-Fehler');
    return d;
  };

  window.testLexware=async function(){
    const s=document.getElementById('lexwareStatus');
    try{s.textContent='Lexware wird geprüft …';const d=await lexwareCall('profile');s.textContent='✓ Verbunden mit '+(d.profile?.companyName||d.profile?.userEmail||'Lexware Office');s.className='status ok'}catch(e){s.textContent=e.message;s.className='status'}
  };

  const oldOpenCustomerForm=openCustomerForm;
  window.openCustomerForm=function(c=null){
    oldOpenCustomerForm(c);
    setTimeout(()=>{
      document.querySelectorAll('#modalBody button').forEach(b=>{if(b.textContent.includes('WISO')){b.textContent='→ Lexware übertragen';b.onclick=syncCustomerLexware}})
    },0);
  };

  window.syncCustomerWiso=window.syncCustomerLexware=async function(){
    try{
      const c=currentCustomer;if(!c)return;
      const s=document.getElementById('cStatus');s.textContent='Übertragung an Lexware …';
      await lexwareCall('createContact',{customer:{name:c.name,contact_person:c.contact_person,email:c.email,phone:c.phone,street:c.street,city:c.city,note:c.note}});
      s.textContent='✓ Kunde an Lexware übertragen';s.className='status ok';
    }catch(e){const s=document.getElementById('cStatus');if(s)s.textContent=e.message;else alert(e.message)}
  };

  window.syncInvoiceLexware=async function(id){
    try{
      const d=documents.find(x=>x.id===id);if(!d)return;
      const c=customers.find(x=>x.id===d.payload?.customer_id)||customers.find(x=>x.name===d.payload?.customer_name);
      if(!c)throw new Error('Kunde zur Rechnung wurde nicht gefunden.');
      const yes=confirm('Rechnung '+(d.document_number||'')+' als Entwurf an Lexware Office übertragen?');
      if(!yes)return;
      await lexwareCall('createInvoice',{customer:{name:c.name,street:c.street,city:c.city,email:c.email},document:{date:d.payload?.date,subject:d.payload?.subject,note:d.payload?.note,positions:(d.payload?.positions||[]).map(p=>({...p,unit:p.unit||'Stück'})),vat:Number(company.vat??19)},finalize:false});
      alert('Rechnung wurde als Entwurf an Lexware übertragen.');
    }catch(e){alert(e.message)}
  };

  window.renderDocs=function(){
    const arr=docFilter==='all'?documents:documents.filter(d=>d.document_type===docFilter);
    document.getElementById('docList').innerHTML=arr.length?arr.map(d=>{
      const st=d.document_type==='rechnung'?(d.status==='paid'?'<span class="pill paid">bezahlt</span>':'<span class="pill open">offen</span>'):'<span class="pill">'+esc(d.document_type)+'</span>';
      return '<div class="item"><div class="row"><div><strong>'+esc(d.title||d.document_type)+' '+esc(d.document_number||'')+'</strong><div class="tiny">'+esc(d.payload?.customer_name||'')+' · '+new Date(d.created_at).toLocaleDateString('de-DE')+'</div><div>'+money(d.total_gross||0)+'</div></div>'+st+'</div><div class="actions">'+(d.document_type==='angebot'?'<button class="btn secondary" onclick="convertDoc(\\''+d.id+'\\',\\'auftrag\\')">→ Auftrag</button>':'')+(d.document_type==='auftrag'?'<button class="btn blue" onclick="convertDoc(\\''+d.id+'\\',\\'rechnung\\')">→ Rechnung</button>':'')+(d.document_type==='rechnung'?'<button class="btn primary" onclick="syncInvoiceLexware(\\''+d.id+'\\')">→ Lexware</button>':'')+(d.document_type==='rechnung'&&d.status!=='paid'?'<button class="btn green" onclick="markPaid(\\''+d.id+'\\')">✓ Bezahlt</button>':'')+'</div></div>';
    }).join(''):'<div class="status">Keine Vorgänge.</div>';
  };

  const oldShowView=showView;
  window.showView=function(id){oldShowView(id);if(id==='wiso'){const k=sessionStorage.getItem('hp_lexware_key')||'';const input=document.getElementById('lexwareKey');if(input&&!input.value)input.value=k}}

  const oldEnter=enter;
  window.enter=async function(){await oldEnter();const back=sessionStorage.getItem('hp_return_view');if(back){sessionStorage.removeItem('hp_return_view');setTimeout(()=>showView(back),50)}};
});
</`+`script>`;
    html=html.replace('</body>',patch+'</body>');
    document.open();document.write(html);document.close();
  }catch(e){document.getElementById('loading').textContent='Laden fehlgeschlagen: '+e.message}
})();
</script></body></html>

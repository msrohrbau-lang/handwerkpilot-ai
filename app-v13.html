<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>HandwerkPilot AI</title></head><body><script>
(async()=>{
  try{
    let html=await (await fetch('/index.html?v=13',{cache:'no-store'})).text();
    html=html.replace(/onclick="printDocument\(\)">PDF \/ Drucken<\/button>/,'onclick="createRealPdf()">📄 PDF erstellen</button>');
    const extra=`<script>
async function createRealPdf(){
 const status=document.getElementById('status');
 try{
  let payload={company:'HandwerkPilot AI',title:'Dokument',filename:'HandwerkPilot.pdf',customer:'',intro:'',positions:[],net:0,vat:19,notes:''};
  const c=typeof companyData==='function'?companyData():{};payload.company=c.firma||'HandwerkPilot AI';
  if(currentTool==='angebot'){
   const net=(positions||[]).reduce((s,p)=>s+(Number(p.qty)||0)*(Number(p.price)||0),0),nr=v('nr')||'Angebot';
   payload={...payload,title:'Angebot',filename:'Angebot-'+nr+'.pdf',number:nr,customer:[v('kunde'),v('kundeAdresse')].filter(Boolean).join('\\n'),intro:[v('vor'),v('ort')?'Baustelle: '+v('ort'):'',v('termin')?'Ausführung: '+v('termin'):''].filter(Boolean).join('\\n'),positions:(positions||[]).map(p=>({desc:p.desc,qty:p.qty,unit:p.unit,price:p.price})),net,vat:Number(v('docVat')||19),notes:v('hin')};
  } else if(currentTool==='rechnung') {
   const nr=v('rnr')||'Rechnung';
   payload={...payload,title:'Rechnung',filename:'Rechnung-'+nr+'.pdf',number:nr,customer:[v('rkunde'),v('rkundeAdresse')].filter(Boolean).join('\\n'),intro:[v('rleistung'),v('rdat')?'Leistungsdatum: '+v('rdat'):''].filter(Boolean).join('\\n'),net:Number(v('rnetto')||0),vat:Number(v('rmwst')||19),notes:v('rziel')?'Zahlungsziel: '+v('rziel'):''};
  } else {payload={...payload,title:titles?.[currentTool]||'Dokument',filename:'HandwerkPilot-Dokument.pdf',intro:document.getElementById('output')?.innerText||promptText?.()||'',showTotals:false};}
  if(status)status.textContent='PDF wird erstellt …';
  const r=await fetch('/api/pdf',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  if(!r.ok) throw new Error('PDF konnte nicht erstellt werden.');
  const blob=await r.blob();
  const file=new File([blob],payload.filename,{type:'application/pdf'});
  if(navigator.share && (!navigator.canShare || navigator.canShare({files:[file]}))){
    await navigator.share({title:payload.title,files:[file]});
    if(status)status.textContent='✓ PDF bereit zum Speichern oder Teilen.';
    return;
  }
  const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=payload.filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);if(status)status.textContent='✓ PDF heruntergeladen.';
 }catch(err){if(err && err.name==='AbortError'){if(status)status.textContent='PDF-Teilen abgebrochen.';return;}if(status)status.textContent='PDF-Fehler: '+(err?.message||err);}
}
<\/script>`;
    html=html.replace('</body>',extra+'</body>');
    document.open();document.write(html);document.close();
  }catch(e){document.body.innerHTML='<p style="font-family:Arial;padding:20px">HandwerkPilot konnte nicht geladen werden. Bitte Seite neu laden.</p>';}
})();
</script></body></html>

<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HandwerkPilot AI</title><style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f4f6f8;color:#172033}.wrap{max-width:920px;margin:auto;padding:22px 16px}.hero{background:#111827;color:white;border-radius:24px;padding:30px 22px}.card{background:white;border-radius:20px;padding:20px;margin-top:16px;box-shadow:0 8px 28px #0001}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.task{padding:18px;border:1px solid #dfe4ea;border-radius:15px;background:#f8fafc;text-align:left;font-weight:700}.task small{display:block;color:#687386;margin-top:5px;font-weight:500}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}label{display:block;font-size:13px;font-weight:700;margin:8px 0 6px}input,textarea,select{width:100%;padding:13px;border:1px solid #dfe4ea;border-radius:12px;font:inherit;box-sizing:border-box}textarea{min-height:100px}.full{grid-column:1/-1}.btn{padding:14px 16px;border:0;border-radius:12px;font-weight:800;margin-right:8px;margin-top:12px}.primary{background:#111827;color:#fff}.secondary{background:#eef2f6}.output{display:none;white-space:pre-wrap;background:#f8fafc;padding:16px;border-radius:14px;margin-top:14px;line-height:1.5}.status{color:#687386;font-size:13px;margin-top:10px}@media(max-width:700px){.grid,.formgrid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><div class="wrap"><section class="hero"><div style="font-weight:800;background:white;color:#111827;display:inline-block;padding:7px 11px;border-radius:999px">Handwerk + KI</div><h1>HandwerkPilot AI</h1><p>Der digitale Büroassistent für Handwerksbetriebe. Angebote, Kundenmails, Baustellenberichte und Leistungsbeschreibungen schneller vorbereiten.</p></section>
<section class="card"><h2>Was soll erledigt werden?</h2><div class="grid">
<button class="task" onclick="showForm('angebot')">🧾 Angebot vorbereiten<small>Kunde, Leistung, Material, Stunden</small></button>
<button class="task" onclick="showForm('mail')">✉️ Kundenmail schreiben<small>Anlass, Empfänger, Ziel</small></button>
<button class="task" onclick="showForm('bericht')">🛠️ Baustellenbericht<small>Arbeiten, Personal, offene Punkte</small></button>
<button class="task" onclick="showForm('leistung')">📋 Leistungsbeschreibung<small>Gewerk, Umfang, Anforderungen</small></button>
</div></section>
<section class="card"><h2 id="title">Angebot vorbereiten</h2><div id="form"></div><button class="btn primary" onclick="generate()">Mit KI erstellen</button><button class="btn secondary" onclick="resetForm()">Neu</button><button class="btn secondary" onclick="copyText()">Kopieren</button><div id="status" class="status"></div><div id="output" class="output"></div></section></div>
<script>
let type='angebot';
const forms={
angebot:`<div class="formgrid"><div><label>Kunde</label><input id="kunde"></div><div><label>Ort / Baustelle</label><input id="ort"></div><div class="full"><label>Leistung</label><textarea id="leistung"></textarea></div><div><label>Material</label><input id="material"></div><div><label>Arbeitszeit</label><input id="stunden"></div><div><label>Preis / Stundensatz</label><input id="preis"></div><div><label>Ausführung</label><input id="termin"></div><div class="full"><label>Hinweise</label><textarea id="hinweise"></textarea></div></div>`,
mail:`<div class="formgrid"><div><label>Empfänger</label><input id="empfaenger"></div><div><label>Ton</label><select id="ton"><option>professionell</option><option>freundlich</option><option>kurz und direkt</option></select></div><div class="full"><label>Anlass</label><textarea id="anlass"></textarea></div><div class="full"><label>Gewünschtes Ergebnis</label><textarea id="ziel"></textarea></div></div>`,
bericht:`<div class="formgrid"><div><label>Baustelle</label><input id="baustelle"></div><div><label>Datum</label><input id="datum" type="date"></div><div><label>Personal</label><input id="personal"></div><div><label>Arbeitszeit</label><input id="arbeitszeit"></div><div class="full"><label>Ausgeführte Arbeiten</label><textarea id="arbeiten"></textarea></div><div class="full"><label>Besonderheiten</label><textarea id="besonderheiten"></textarea></div><div class="full"><label>Offene Punkte</label><textarea id="offen"></textarea></div></div>`,
leistung:`<div class="formgrid"><div><label>Gewerk</label><input id="gewerk"></div><div><label>Objekt</label><input id="objekt"></div><div class="full"><label>Umfang</label><textarea id="umfang"></textarea></div><div><label>Material</label><input id="mat"></div><div><label>Norm / Qualität</label><input id="norm"></div><div class="full"><label>Besondere Anforderungen</label><textarea id="anforderungen"></textarea></div></div>`};
const titles={angebot:'Angebot vorbereiten',mail:'Kundenmail schreiben',bericht:'Baustellenbericht',leistung:'Leistungsbeschreibung'};
function showForm(t){type=t;document.getElementById('title').textContent=titles[t];document.getElementById('form').innerHTML=forms[t];document.getElementById('output').style.display='none';document.getElementById('status').textContent='';}
function v(id){let e=document.getElementById(id);return e?e.value.trim():''}
function promptText(){if(type==='angebot')return `Erstelle ein professionelles Handwerker-Angebot auf Deutsch. Kunde: ${v('kunde')}. Ort/Baustelle: ${v('ort')}. Leistung: ${v('leistung')}. Material: ${v('material')}. Arbeitszeit: ${v('stunden')}. Preis/Stundensatz: ${v('preis')}. Ausführung: ${v('termin')}. Hinweise: ${v('hinweise')}. Formuliere klar, seriös und übersichtlich.`;if(type==='mail')return `Schreibe eine ${v('ton')} Kundenmail auf Deutsch. Empfänger: ${v('empfaenger')}. Anlass: ${v('anlass')}. Ziel: ${v('ziel')}.`;if(type==='bericht')return `Erstelle einen professionellen Baustellenbericht. Baustelle: ${v('baustelle')}. Datum: ${v('datum')}. Personal: ${v('personal')}. Arbeitszeit: ${v('arbeitszeit')}. Arbeiten: ${v('arbeiten')}. Besonderheiten: ${v('besonderheiten')}. Offene Punkte: ${v('offen')}.`;return `Erstelle eine professionelle Leistungsbeschreibung. Gewerk: ${v('gewerk')}. Objekt: ${v('objekt')}. Umfang: ${v('umfang')}. Material: ${v('mat')}. Norm/Qualität: ${v('norm')}. Anforderungen: ${v('anforderungen')}.`;}
async function generate(){let out=document.getElementById('output'),status=document.getElementById('status'),prompt=promptText();out.style.display='block';out.textContent='Wird erstellt …';status.textContent='KI-Anfrage läuft';try{let r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt})});let d=await r.json();if(r.ok&&(d.answer||d.text)){out.textContent=d.answer||d.text;status.textContent='Fertig';}else{out.textContent=prompt;status.textContent='KI-API noch nicht aktiv – Prompt vorbereitet.'}}catch(e){out.textContent=prompt;status.textContent='KI-API noch nicht aktiv – Prompt vorbereitet.'}}
function resetForm(){showForm(type)}
async function copyText(){let t=document.getElementById('output').textContent;if(!t)return;try{await navigator.clipboard.writeText(t);document.getElementById('status').textContent='Text kopiert.'}catch(e){}}
showForm('angebot');
</script></body></html>

<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HandwerkPilot AI</title><style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f4f6f8;color:#172033}.w{max-width:900px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.top button{border:0;background:#eef2f6;border-radius:12px;padding:10px 12px;font-weight:700}.hero{background:#111827;color:#fff;border-radius:22px;padding:28px}.hero h1{margin:6px 0 8px}.card{background:#fff;border-radius:18px;padding:20px;margin-top:14px}.g{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.tile,.btn{border:0;border-radius:12px;padding:14px;font-weight:700}.tile{background:#f8fafc;border:1px solid #dfe4ea;text-align:left;min-height:82px}.tile small{display:block;color:#687386;margin-top:5px}.btn{margin-top:10px;margin-right:6px}.pri{background:#111827;color:#fff}.sec{background:#eef2f6}.hidden{display:none}label{display:block;font-size:13px;font-weight:700;margin:8px 0 5px}input,textarea,select{width:100%;box-sizing:border-box;padding:12px;border:1px solid #dfe4ea;border-radius:10px;font:inherit}textarea{min-height:90px}.full{grid-column:1/-1}.out{display:none;white-space:pre-wrap;background:#f8fafc;padding:14px;border-radius:12px;margin-top:12px}.status{font-size:13px;color:#687386;margin-top:8px}@media(max-width:650px){.g{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><div class="w">
<div class="top"><strong>HandwerkPilot AI</strong><button onclick="openSettings()">⚙️ Einstellungen</button></div>
<div class="hero"><b>Handwerk + KI</b><h1>Dein Büroassistent</h1><p>Vom Handy direkt zu Angebot, Rechnung, Kundenmail, Baustellenbericht oder Leistungsbeschreibung.</p></div>
<div id="dash" class="card"><h2>Was möchtest du erledigen?</h2><div class="g">
<button class="tile" onclick="openTool('angebot')">🧾 Angebot<small>Positionen, Preise, Kalkulation</small></button>
<button class="tile" onclick="openTool('rechnung')">💶 Rechnung<small>Direkt erstellen</small></button>
<button class="tile" onclick="openTool('mail')">✉️ Kundenmail<small>Professionell formulieren</small></button>
<button class="tile" onclick="openTool('bericht')">🛠️ Baustellenbericht<small>Arbeiten dokumentieren</small></button>
<button class="tile" onclick="openTool('leistung')">📋 Leistungsbeschreibung<small>Technisch sauber</small></button>
<button class="tile" onclick="openTool('assistent')">🤖 KI-Assistent<small>Freie Aufgabe</small></button>
</div></div>
<div id="tool" class="card hidden"><button class="btn sec" onclick="home()">← Zurück</button><h2 id="title"></h2><div id="form"></div><button class="btn pri" onclick="gen()">Mit KI erstellen</button><button class="btn sec" onclick="saveDraft()">Entwurf speichern</button><button class="btn sec" onclick="copyOut()">Kopieren</button><button class="btn sec" onclick="window.print()">PDF / Drucken</button><div id="status" class="status"></div><div id="out" class="out"></div></div>
<div id="settings" class="card hidden"><button class="btn sec" onclick="closeSettings()">← Zurück</button><h2>Firmendaten</h2><div class="g"><div><label>Firma</label><input id="firma"></div><div><label>Ansprechpartner</label><input id="ansp"></div><div><label>E-Mail</label><input id="email"></div><div><label>Telefon</label><input id="tel"></div><div class="full"><label>Anschrift</label><input id="adresse"></div></div><button class="btn pri" onclick="saveCompany()">Speichern</button><div id="settingsStatus" class="status"></div></div>
</div><script>
let current='angebot',pos=[{b:'',m:1,e:'Stk.',p:0}];
const forms={
angebot:`<div class="g"><div><label>Kunde</label><input id="kunde"></div><div><label>Baustelle</label><input id="ort"></div><div><label>Angebotsnr.</label><input id="nr"></div><div><label>Ausführung</label><input id="termin"></div><div class="full"><label>Vorbemerkung</label><textarea id="vor"></textarea></div></div><h3>Positionen</h3><div id="positions"></div><button class="btn sec" onclick="addPos()">+ Position</button><div id="sum" style="text-align:right;font-weight:700;margin-top:10px"></div><label>Hinweise / Zahlungsziel</label><textarea id="hin"></textarea>`,
rechnung:`<div class="g"><div><label>Kunde</label><input id="rkunde"></div><div><label>Rechnungsnr.</label><input id="rnr"></div><div><label>Leistungsdatum</label><input id="rdat" type="date"></div><div><label>Zahlungsziel</label><input id="rziel"></div><div class="full"><label>Leistung / Positionen</label><textarea id="rleistung"></textarea></div><div><label>Netto</label><input id="rnetto" type="number" step=".01"></div><div><label>MwSt. %</label><input id="rmwst" type="number" value="19"></div></div>`,
mail:`<div class="g"><div><label>Empfänger</label><input id="emp"></div><div><label>Ton</label><select id="ton"><option>professionell</option><option>freundlich</option><option>kurz und direkt</option><option>bestimmt</option></select></div><div class="full"><label>Anlass</label><textarea id="anlass"></textarea></div><div class="full"><label>Ziel</label><textarea id="ziel"></textarea></div></div>`,
bericht:`<div class="g"><div><label>Baustelle</label><input id="bau"></div><div><label>Datum</label><input id="dat" type="date"></div><div><label>Personal</label><input id="pers"></div><div><label>Arbeitszeit</label><input id="zeit"></div><div class="full"><label>Arbeiten</label><textarea id="arb"></textarea></div><div class="full"><label>Besonderheiten</label><textarea id="bes"></textarea></div><div class="full"><label>Offene Punkte</label><textarea id="offen"></textarea></div></div>`,
leistung:`<div class="g"><div><label>Gewerk</label><input id="gew"></div><div><label>Objekt</label><input id="obj"></div><div class="full"><label>Umfang</label><textarea id="umf"></textarea></div><div><label>Material</label><input id="mat"></div><div><label>Norm / Qualität</label><input id="norm"></div><div class="full"><label>Anforderungen</label><textarea id="anf"></textarea></div></div>`,
assistent:`<label>Was soll die KI für dich erledigen?</label><textarea id="frei"></textarea>`};
const titles={angebot:'Angebot erstellen',rechnung:'Rechnung erstellen',mail:'Kundenmail schreiben',bericht:'Baustellenbericht',leistung:'Leistungsbeschreibung',assistent:'KI-Assistent'};
function v(i){let e=document.getElementById(i);return e?e.value.trim():''} function money(n){return new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(+n||0)} function company(){return [v('firma'),v('ansp'),v('adresse'),v('email'),v('tel')].filter(Boolean).join(' | ')}
function openTool(t){current=t;dash.classList.add('hidden');settings.classList.add('hidden');tool.classList.remove('hidden');title.textContent=titles[t];form.innerHTML=forms[t];out.style.display='none';status.textContent='';if(t==='angebot')renderPos()}
function home(){tool.classList.add('hidden');dash.classList.remove('hidden')} function openSettings(){dash.classList.add('hidden');tool.classList.add('hidden');settings.classList.remove('hidden');loadCompany()} function closeSettings(){settings.classList.add('hidden');dash.classList.remove('hidden')}
function renderPos(){positions.innerHTML=pos.map((x,i)=>`<div class="g"><input placeholder="Beschreibung" value="${x.b}" oninput="setp(${i},'b',this.value)"><input type="number" step=".01" placeholder="Menge" value="${x.m}" oninput="setp(${i},'m',this.value)"><input placeholder="Einheit" value="${x.e}" oninput="setp(${i},'e',this.value)"><input type="number" step=".01" placeholder="Einzelpreis €" value="${x.p}" oninput="setp(${i},'p',this.value)"></div>`).join('');let n=pos.reduce((s,x)=>s+(+x.m||0)*(+x.p||0),0);sum.textContent=`Netto ${money(n)} · MwSt. ${money(n*.19)} · Brutto ${money(n*1.19)}`}
function setp(i,k,x){pos[i][k]=(k==='m'||k==='p')?+x:x;renderPos()} function addPos(){pos.push({b:'',m:1,e:'Stk.',p:0});renderPos()}
function promptText(){if(current==='angebot'){let n=pos.reduce((s,x)=>s+(+x.m||0)*(+x.p||0),0),pl=pos.map((x,i)=>`${i+1}. ${x.b}: ${x.m} ${x.e} × ${money(x.p)} = ${money((+x.m||0)*(+x.p||0))}`).join('\n');return `Erstelle ein professionelles Angebot. Firma: ${company()}. Kunde: ${v('kunde')}. Baustelle: ${v('ort')}. Angebotsnr.: ${v('nr')}. Ausführung: ${v('termin')}. Vorbemerkung: ${v('vor')}. Positionen:\n${pl}\nNetto ${money(n)}, MwSt. ${money(n*.19)}, Brutto ${money(n*1.19)}. Hinweise: ${v('hin')}. Erfinde keine Preise.`}if(current==='rechnung'){let n=+v('rnetto')||0,m=+v('rmwst')||19;return `Erstelle eine professionelle Rechnung. Firma: ${company()}. Kunde: ${v('rkunde')}. Rechnungsnr.: ${v('rnr')}. Leistungsdatum: ${v('rdat')}. Leistung: ${v('rleistung')}. Netto ${money(n)}, MwSt. ${m} %, Brutto ${money(n*(1+m/100))}. Zahlungsziel: ${v('rziel')}.`}if(current==='mail')return `Schreibe eine ${v('ton')} Kundenmail. Absender: ${company()}. Empfänger: ${v('emp')}. Anlass: ${v('anlass')}. Ziel: ${v('ziel')}.`;if(current==='bericht')return `Erstelle einen professionellen Baustellenbericht. Firma: ${company()}. Baustelle: ${v('bau')}. Datum: ${v('dat')}. Personal: ${v('pers')}. Arbeitszeit: ${v('zeit')}. Arbeiten: ${v('arb')}. Besonderheiten: ${v('bes')}. Offene Punkte: ${v('offen')}.`;if(current==='leistung')return `Erstelle eine professionelle technische Leistungsbeschreibung. Firma: ${company()}. Gewerk: ${v('gew')}. Objekt: ${v('obj')}. Umfang: ${v('umf')}. Material: ${v('mat')}. Norm/Qualität: ${v('norm')}. Anforderungen: ${v('anf')}.`;return `Du bist ein Büroassistent für einen Handwerksbetrieb. Aufgabe: ${v('frei')}`}
async function gen(){let p=promptText();out.style.display='block';out.textContent='Wird erstellt …';status.textContent='KI-Anfrage läuft';try{let r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:p})}),d=await r.json();out.textContent=d.answer||d.text||p;status.textContent=r.ok?'Fertig':'Vorbereiteter Text angezeigt.'}catch(e){out.textContent=p;status.textContent='Vorbereiteter Text angezeigt.'}}
function saveCompany(){localStorage.hpcompany=JSON.stringify({firma:v('firma'),ansp:v('ansp'),email:v('email'),tel:v('tel'),adresse:v('adresse')});settingsStatus.textContent='Firmendaten gespeichert.'} function loadCompany(){try{let c=JSON.parse(localStorage.hpcompany||'{}');Object.entries(c).forEach(([k,x])=>{let e=document.getElementById(k);if(e)e.value=x})}catch(e){}}
function saveDraft(){let f={};document.querySelectorAll('#form input,#form textarea,#form select').forEach(e=>f[e.id]=e.value);localStorage.hpdraft=JSON.stringify({current,f,pos});status.textContent='Entwurf gespeichert.'} async function copyOut(){let t=out.textContent;if(t)try{await navigator.clipboard.writeText(t);status.textContent='Text kopiert.'}catch(e){}}
loadCompany();
</script></body></html>

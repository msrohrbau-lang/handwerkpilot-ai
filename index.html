<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HandwerkPilot AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f5f7fa;color:#172033}
.wrap{max-width:900px;margin:auto;padding:28px 18px}
.hero{background:#111827;color:#fff;border-radius:24px;padding:34px 24px;margin-bottom:20px}
h1{font-size:38px;margin:0 0 12px}
.sub{font-size:18px;line-height:1.5;color:#dbe3ef}
.badge{display:inline-block;background:#fff;color:#111827;padding:8px 12px;border-radius:999px;font-weight:700;margin-bottom:18px}
.card{background:#fff;border-radius:20px;padding:24px;margin:16px 0;box-shadow:0 8px 30px #0001}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.task{background:#f0f3f7;border:0;border-radius:15px;padding:18px;text-align:left;font:inherit;font-weight:700;color:#172033;cursor:pointer}
.task:active{transform:scale(.98)}
textarea{width:100%;min-height:150px;border:1px solid #d5dae3;border-radius:14px;padding:14px;font:inherit}
.mainbtn{width:100%;border:0;border-radius:14px;padding:16px;background:#111827;color:#fff;font-size:17px;font-weight:700;margin-top:12px}
#answer{white-space:pre-wrap;line-height:1.5;margin-top:16px;background:#f5f7fa;border-radius:14px;padding:16px;display:none}
footer{text-align:center;color:#687386;padding:25px}
</style>
</head>
<body>
<div class="wrap">
<section class="hero">
<div class="badge">Handwerk + KI</div>
<h1>HandwerkPilot AI</h1>
<div class="sub">Der digitale Assistent für Handwerksbetriebe. Angebote, Baustellentexte, Kundenkommunikation und Büroarbeit schneller vorbereiten.</div>
</section>

<section class="card">
<h2>Was soll erledigt werden?</h2>
<div class="grid">
<button class="task" onclick="selectTask('angebot')">🧾 Angebot vorbereiten</button>
<button class="task" onclick="selectTask('mail')">✉️ Kundenmail schreiben</button>
<button class="task" onclick="selectTask('bericht')">🛠️ Baustellenbericht</button>
<button class="task" onclick="selectTask('leistung')">📋 Leistungsbeschreibung</button>
</div>
</section>

<section class="card" id="assistant">
<h2>KI-Assistent</h2>
<p>Beschreibe kurz deine Aufgabe.</p>
<textarea id="prompt" placeholder="Aufgabe eingeben …"></textarea>
<button class="mainbtn" onclick="go()">Text erstellen</button>
<div id="answer"></div>
</section>

<footer>HandwerkPilot AI · Testversion</footer>
</div>

<script>
function selectTask(type){
  const prompts = {
    angebot: "Erstelle ein professionelles Angebot für einen Handwerkskunden. Frage mich nach den fehlenden Angaben wie Leistung, Menge, Material, Arbeitszeit, Preis und Ausführungsort.",
    mail: "Schreibe eine professionelle Kundenmail. Frage mich zuerst nach Empfänger, Anlass und gewünschtem Ergebnis.",
    bericht: "Erstelle einen professionellen Baustellenbericht. Frage mich nach Baustelle, Datum, ausgeführten Arbeiten, Personal, Besonderheiten und offenen Punkten.",
    leistung: "Erstelle eine professionelle Leistungsbeschreibung für ein Handwerksprojekt. Frage mich nach Gewerk, Umfang, Material, Ausführung und besonderen Anforderungen."
  };
  document.getElementById('prompt').value = prompts[type];
  document.getElementById('assistant').scrollIntoView({behavior:'smooth'});
  document.getElementById('prompt').focus();
}

function go(){
  const p=document.getElementById('prompt').value.trim();
  const a=document.getElementById('answer');
  a.style.display='block';
  a.textContent=p ? 'Aufgabe übernommen. Die KI-Verbindung wird im nächsten Schritt vollständig angeschlossen.' : 'Bitte zuerst eine Aufgabe eingeben.';
}
</script>
</body>
</html>

<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HandwerkPilot AI</title><style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;background:#f4f6f8;color:#172033}.w{max-width:900px;margin:auto;padding:20px}.hero{background:#111827;color:#fff;padding:28px;border-radius:22px}.card{background:#fff;padding:20px;border-radius:18px;margin-top:14px}.g{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.task,.btn{border:0;border-radius:12px;padding:14px;font-weight:700}.task{background:#eef2f6;text-align:left}.btn{margin-top:10px;margin-right:6px}.pri{background:#111827;color:#fff}.sec{background:#eef2f6}label{display:block;font-size:13px;font-weight:700;margin:8px 0 5px}input,textarea,select{width:100%;box-sizing:border-box;padding:12px;border:1px solid #dfe4ea;border-radius:10px;font:inherit}textarea{min-height:90px}.out{display:none;white-space:pre-wrap;background:#f8fafc;padding:14px;border-radius:12px;margin-top:12px}.status{font-size:13px;color:#687386;margin-top:8px}.tot{font-weight:700;text-align:right;margin-top:10px}@media(max-width:650px){.g{grid-template-columns:1fr}}@media print{.no{display:none}.card{box-shadow:none}.out{display:block}}
</style></head><body><div class="w"><div class="hero"><b>Handwerk + KI</b><h1>HandwerkPilot AI</h1><p>Der digitale Büroassistent für Handwerksbetriebe.</p></div>
<div class="card no"><h2>Firmendaten</h2><div class="g"><div><label>Firma</label><input id="firma"></div><div><label>Ansprechpartner</label><input id="ansp"></div><div><label>E-Mail</label><input id="email"></div><div><label>Telefon</label><input id="tel"></div></div><button class="btn sec" onclick="saveCompany()">Speichern</button></div>
<div class="card no"><h2>Aufgabe wählen</h2><div class="g"><button class="task" onclick="show('angebot')">🧾 Angebot</button><button class="task" onclick="show('mail')">✉️ Kundenmail</button><button class="task" onclick="show('bericht')">🛠️ Baustellenbericht</button><button class="task" onclick="show('leistung')">📋 Leistungsbeschreibung</button></div></div>
<div class="card"><h2 id="title"></h2><div id="form"></div><button class="btn pri no" onclick="gen()">Mit KI erstellen</button><button class="btn sec no" onclick="saveDraft()">Entwurf speichern</button><button class="btn sec no" onclick="copyOut()">Kopieren</button><button class="btn sec no" onclick="window.print()">PDF / Drucken</button><div id="status" class="status no"></div><div id="out" class="out"></div></div></div>
<script>
let type='angebot',pos=[{b:'',m:1,e:'Stk.',p:0}];
const F={
angebot:`<div class="g"><div><label>Kunde</label><input id="kunde"></div><div><label>Baustelle</label><input id="ort"></div><div><label>Angebotsnr.</label><input id="nr"></div><div><label>Ausführung</label><input id="termin"></div></div><label>Vorbemerkung</label><textarea id="vor"></textarea><h3>Positionen</h3><div id="positions"></div><button class="btn sec no" onclick="addPos()">+ Position</button><div class="tot" id="sum"></div><label>Hinweise / Zahlungsziel</label><textarea id="hin"></textarea>`,
mail:`<div class="g"><div><label>Empfänger</label><input id="emp"></div><div><label>Ton</label><select id="ton"><option>professionell</option><option>freundlich</option><option>kurz und direkt</option></select></div></div><label>Anlass</label><textarea id="anlass"></textarea><label>Ziel</label><textarea id="ziel"></textarea>`,
bericht:`<div class="g"><div><label>Baustelle</label><input id="bau"></div><div><label>Datum</label><input id="dat" type="date"></div><div><label>Personal</label><input id="pers"></div><div><label>Arbeitszeit</label><input id="zeit"></div></div><label>Arbeiten</label><textarea id="arb"></textarea><label>Besonderheiten</label><textarea id="bes"></textarea><label>Offene Punkte</label><textarea id="offen"></textarea>`,
leistung:`<div class="g"><div><label>Gewerk</label><input id="gew"></div><div><label>Objekt</label><input id="obj"></div></div><label>Umfang</label><textarea id="umf"></textarea><label>Material</label><input id="mat"><label>Anforderungen</label><textarea id="anf"></textarea>`};
const T={angebot:'Angebot erstellen',mail:'Kundenmail schreiben',bericht:'Baustellenbericht',leistung:'Leistungsbeschreibung'};
function v(i){let e=document.getElementById(i);return e?e.value.trim():''}
function money(n){return new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(n||0)}
function show(t){type=t;document.getElementById('title').textContent=T[t];document.getElementById('form').innerHTML=F[t];document.getElementById('out').style.display='none';if(t==='angebot')render()}
function render(){let h=pos.map((x,i)=>`<div class="g"><input placeholder="Beschreibung" value="${x.b}" oninput="setp(${i},'b',this.value)"><input type="number" step=".01" placeholder="Menge" value="${x.m}" oninput="setp(${i},'m',this.value)"><input placeholder="Einheit" value="${x.e}" oninput="setp(${i},'e',this.value)"><input type="number" step=".01" placeholder="Einzelpreis €" value="${x.p}" oninput="setp(${i},'p',this.value)"></div>`).join('');document.getElementById('positions').innerHTML=h;let n=pos.reduce((s,x)=>s+(+x.m||0)*(+x.p||0),0);document.getElementById('sum').textContent=`Netto ${money(n)} · MwSt. ${money(n*.19)} · Brutto ${money(n*1.19)}`}
function setp(i,k,x){pos[i][k]=(k==='m'||k==='p')?+x:x;render()}function addPos(){pos.push({b:'',m:1,e:'Stk.',p:0});render()}
function company(){return [v('firma'),v('ansp'),v('email'),v('tel')].filter(Boolean).join(' | ')}
function prompt(){if(type==='angebot'){let n=pos.reduce((s,x)=>s+(+x.m||0)*(+x.p||0),0),pl=pos.map((x,i)=>`${i+1}. ${x.b}: ${x.m} ${x.e} × ${money(x.p)} = ${money((+x.m||0)*(+x.p||0))}`).join('\n');return `Erstelle ein professionelles Angebot. Firma: ${company()} Kunde: ${v('kunde')} Baustelle: ${v('ort')} Angebotsnr.: ${v('nr')} Ausführung: ${v('termin')} Vorbemerkung: ${v('vor')} Positionen:\n${pl}\nNetto ${money(n)}, MwSt. 19 % ${money(n*.19)}, Brutto ${money(n*1.19)}. Hinweise: ${v('hin')}. Erfinde keine Preise.`}if(type==='mail')return `Schreibe eine ${v('ton')} Kundenmail. Absender: ${company()}. Empfänger: ${v('emp')}. Anlass: ${v('anlass')}. Ziel: ${v('ziel')}.`;if(type==='bericht')return `Erstelle einen professionellen Baustellenbericht. Firma: ${company()}. Baustelle: ${v('bau')}. Datum: ${v('dat')}. Personal: ${v('pers')}. Arbeitszeit: ${v('zeit')}. Arbeiten: ${v('arb')}. Besonderheiten: ${v('bes')}. Offene Punkte: ${v('offen')}.`;return `Erstelle eine technische Leistungsbeschreibung. Firma: ${company()}. Gewerk: ${v('gew')}. Objekt: ${v('obj')}. Umfang: ${v('umf')}. Material: ${v('mat')}. Anforderungen: ${v('anf')}.`}
async function gen(){let o=document.getElementById('out'),s=document.getElementById('status'),p=prompt();o.style.display='block';o.textContent='Wird erstellt …';try{let r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:p})}),d=await r.json();o.textContent=(d.answer||d.text||p);s.textContent=r.ok?'Fertig':'Vorbereiteter Text angezeigt.'}catch(e){o.textContent=p;s.textContent='Vorbereiteter Text angezeigt.'}}
function saveCompany(){localStorage.hpcompany=JSON.stringify({firma:v('firma'),ansp:v('ansp'),email:v('email'),tel:v('tel')});document.getElementById('status').textContent='Firmendaten gespeichert.'}
function saveDraft(){let f={};document.querySelectorAll('#form input,#form textarea,#form select').forEach(e=>f[e.id]=e.value);localStorage.hpdraft=JSON.stringify({type,f,pos});document.getElementById('status').textContent='Entwurf gespeichert.'}
async function copyOut(){let t=document.getElementById('out').textContent;if(t)await navigator.clipboard.writeText(t)}
function load(){try{let c=JSON.parse(localStorage.hpcompany||'{}');Object.entries(c).forEach(([k,x])=>{let e=document.getElementById(k);if(e)e.value=x})}catch(e){}}
show('angebot');load();
</script></body></html>

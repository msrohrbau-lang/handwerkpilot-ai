<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Adminportal – HandwerkPilot</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f4f6f8;color:#142033}.wrap{max-width:1120px;margin:auto;padding:28px 18px}.head{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:20px}.brand{font-weight:950;font-size:22px}.muted{color:#667085}.card{background:#fff;border-radius:20px;padding:20px;box-shadow:0 7px 24px rgba(15,23,42,.06);margin:12px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.kpi{background:#fff;border-radius:18px;padding:18px;box-shadow:0 7px 24px rgba(15,23,42,.06)}.kpi b{font-size:30px;display:block;margin-top:6px}.btn{border:0;border-radius:12px;padding:12px 14px;font-weight:850;cursor:pointer;background:#0f172a;color:#fff}.secondary{background:#eef2f6;color:#142033}.login{max-width:420px;margin:70px auto}.login input{width:100%;padding:12px;border:1px solid #dbe2ea;border-radius:12px;margin:6px 0 12px;font:inherit}label{font-size:13px;font-weight:800}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:12px 9px;border-bottom:1px solid #e7ebf0;vertical-align:top}th{color:#667085;font-size:12px}.pill{display:inline-block;padding:5px 8px;border-radius:999px;font-size:12px;font-weight:850;background:#eef2f6}.active{background:#e7f7ef;color:#087f5b}.trialing{background:#e8efff;color:#2456b8}.attention{background:#fff1f0;color:#b42318}.status{margin-top:12px;color:#667085}@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}.head{align-items:flex-start;flex-direction:column}table{font-size:12px}th,td{padding:9px 5px}.hideMobile{display:none}}
</style></head><body>
<div class="wrap"><div class="head"><div><div class="brand">HP · HandwerkPilot Admin</div><div class="muted">Registrierungen und Zahlungsstatus</div></div><div id="actions" hidden><button class="btn secondary" onclick="loadData()">Aktualisieren</button> <button class="btn secondary" onclick="logout()">Abmelden</button></div></div>
<section id="login" class="card login"><h1>Adminportal</h1><p class="muted">Nur für Michael und Laura.</p><label>E-Mail</label><input id="email" type="email" autocomplete="email"><label>Passwort</label><input id="password" type="password" autocomplete="current-password"><button class="btn" onclick="login()">Anmelden</button><div id="loginStatus" class="status"></div></section>
<section id="dashboard" hidden><div class="grid"><div class="kpi"><span class="muted">Registriert</span><b id="registered">–</b></div><div class="kpi"><span class="muted">Aktiv bezahlt</span><b id="active">–</b></div><div class="kpi"><span class="muted">In Testphase</span><b id="trialing">–</b></div><div class="kpi"><span class="muted">Achtung nötig</span><b id="attention">–</b></div></div><div class="card"><div class="head"><div><h2 style="margin:0">Kunden</h2><div class="muted" id="updated"></div></div></div><div style="overflow:auto"><table><thead><tr><th>Registriert</th><th>Kunde / Betrieb</th><th class="hideMobile">E-Mail</th><th>Status</th><th class="hideMobile">Test / nächste Zahlung</th><th>Zahlung</th></tr></thead><tbody id="rows"></tbody></table></div></div></section>
</div>
<script>
let sb,session;const $=id=>document.getElementById(id);const url='https://dbaiwcqoigqgknmtctwl.supabase.co',key='sb_publishable_8irMEHCYLPzCmMljWAUCaA_L7xJSZlr';
const fmt=v=>v?new Date(v).toLocaleDateString('de-DE'):'–';const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function badge(status,billing){const bad=['past_due','unpaid','canceled','incomplete','not_started'].includes(status)||billing;const text=billing&&status==='not_started'?'Zahlungsdaten fehlen':status==='active'?'Bezahlt':status==='trialing'?'Testphase':status==='past_due'?'Überfällig':status==='canceled'?'Gekündigt':status==='incomplete'?'Unvollständig':'Noch nicht gestartet';return '<span class="pill '+(bad?'attention':status==='active'?'active':'trialing')+'">'+text+'</span>'}
async function init(){sb=supabase.createClient(url,key);session=(await sb.auth.getSession()).data.session;if(session)loadData()}
async function login(){try{$('loginStatus').textContent='Anmeldung läuft …';const {data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;session=data.session;await loadData()}catch(e){$('loginStatus').textContent=e.message||'Anmeldung fehlgeschlagen.'}}
async function loadData(){try{const r=await fetch(url+'/functions/v1/admin-overview',{headers:{Authorization:'Bearer '+session.access_token,apikey:key}});const d=await r.json();if(!r.ok)throw new Error(d.error||'Daten konnten nicht geladen werden.');$('login').hidden=true;$('dashboard').hidden=false;$('actions').hidden=false;for(const k of ['registered','active','trialing','attention'])$(k).textContent=d.summary[k];$('updated').textContent='Letzte Aktualisierung: '+new Date(d.generated_at).toLocaleString('de-DE');$('rows').innerHTML=d.customers.map(x=>'<tr><td>'+fmt(x.registered_at)+'</td><td><b>'+esc(x.name||'–')+'</b><br><span class="muted">'+esc(x.company||'–')+'</span></td><td class="hideMobile">'+esc(x.email)+'</td><td>'+badge(x.status,x.billing_setup_required)+'</td><td class="hideMobile">Test bis: '+fmt(x.trial_ends_at)+'<br>Nächste: '+fmt(x.current_period_end)+'</td><td>Stand: '+fmt(x.payment_status_updated_at)+(x.cancel_at_period_end?'<br>Endet zum Laufzeitende':'')+'</td></tr>').join('')||'<tr><td colspan="6">Noch keine Registrierungen.</td></tr>'}catch(e){$('loginStatus').textContent=e.message||'Fehler beim Laden.'}}
async function logout(){await sb.auth.signOut();session=null;$('login').hidden=false;$('dashboard').hidden=true;$('actions').hidden=true}
init();
</script></body></html>

<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HandwerkPilot Entwürfe</title><meta name="theme-color" content="#0f172a"><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f3f5f7;color:#142033;margin:0;padding:20px}.wrap{max-width:760px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.brand{font-weight:900;font-size:20px}.btn,a.btn{border:0;border-radius:12px;padding:12px 14px;font-weight:800;text-decoration:none;display:inline-block}.primary{background:#0f172a;color:#fff}.secondary{background:#eef2f6;color:#142033}.card{background:#fff;border-radius:18px;padding:16px;margin:10px 0;box-shadow:0 6px 20px rgba(15,23,42,.06)}small{color:#667085}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.empty{background:#fff;border-radius:18px;padding:22px;color:#667085}.offer{display:none;background:#fff;border-radius:18px;padding:20px;margin-top:14px;box-shadow:0 6px 20px rgba(15,23,42,.06)}.row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid #eef2f6}.total{font-weight:900;font-size:19px;border-top:2px solid #0f172a;margin-top:8px;padding-top:10px}.back{margin-top:14px}</style></head><body><div class="wrap"><div class="top"><div class="brand">HandwerkPilot · Entwürfe</div><a class="btn secondary" href="./">← Startseite</a></div><div id="list"></div><div id="offer" class="offer"></div></div><script>const money=n=>new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(Number(n)||0);const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));function getDrafts(){try{const a=JSON.parse(localStorage.getItem('hp_drafts')||'[]');return Array.isArray(a)?a:[]}catch{return []}}function render(){const a=getDrafts(),el=document.getElementById('list');if(!a.length){el.innerHTML='<div class="empty">Noch keine Entwürfe auf diesem Gerät gespeichert.</div>';return}el.innerHTML=a.map((d,i)=>`<div class="card"><strong>${d.type==='angebot'?'🧾 Angebot':esc(d.type||'Entwurf')}</strong><br><small>${esc(d.date||'')}</small><div class="actions"><button class="btn primary" onclick="openDraft(${i})">Öffnen</button><button class="btn secondary" onclick="del(${i})">Löschen</button></div></div>`).join('')}function del(i){const a=getDrafts();a.splice(i,1);localStorage.setItem('hp_drafts',JSON.stringify(a));render();document.getElementById('offer').style.display='none'}function openDraft(i){const d=getDrafts()[i];if(!d)return;if(d.type!=='angebot'){document.getElementById('offer').innerHTML='<strong>Entwurf</strong><pre style="white-space:pre-wrap">'+esc(JSON.stringify(d.fields||{},null,2))+'</pre>';document.getElementById('offer').style.display='block';return}const f=d.fields||{},p=Array.isArray(d.positions)?d.positions:[],net=p.reduce((s,x)=>s+(Number(x.qty)||0)*(Number(x.price)||0),0),vat=Number(f.docVat||19),tax=net*vat/100;document.getElementById('offer').innerHTML=`<h2>Angebot ${esc(f.nr||'')}</h2><p><strong>${esc(f.kunde||'')}</strong><br>${esc(f.kundeAdresse||'')}</p><p>Baustelle: ${esc(f.ort||'')}<br>Ausführung: ${esc(f.termin||'')}</p><p>${esc(f.vor||'')}</p>${p.map((x,n)=>`<div class="row"><span>${n+1}. ${esc(x.desc)}</span><span>${esc(x.qty)} ${esc(x.unit)} × ${money(x.price)} = <strong>${money((Number(x.qty)||0)*(Number(x.price)||0))}</strong></span></div>`).join('')}<div class="row"><span>Netto</span><strong>${money(net)}</strong></div><div class="row"><span>MwSt. ${vat}%</span><strong>${money(tax)}</strong></div><div class="row total"><span>Brutto</span><span>${money(net+tax)}</span></div><p>${esc(f.hin||'')}</p><div class="back"><button class="btn secondary" onclick="document.getElementById('offer').style.display='none'">Schließen</button></div>`;document.getElementById('offer').style.display='block';document.getElementById('offer').scrollIntoView({behavior:'smooth'})}render();</script></body></html>

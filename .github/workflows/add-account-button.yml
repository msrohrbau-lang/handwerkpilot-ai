name: Add account button

on:
  push:
    paths:
      - '.github/workflows/add-account-button.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert Konto und Abo button
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='<button class="ib" onclick="showSettings()">⚙️</button><button class="ib" onclick="logout()">↪</button>'
          new='<button class="ib" onclick="showSettings()">⚙️ Einstellungen</button><button class="ib" onclick="location.href=\'/konto.html\'">💳 Konto & Abo</button><button class="ib" onclick="logout()">↪</button>'
          if old not in s:
              raise SystemExit('Nav pattern not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add Konto und Abo button to app navigation"
          git push

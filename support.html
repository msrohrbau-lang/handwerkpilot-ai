<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Support – HandwerkPilot</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#142033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.box{max-width:650px;margin:55px auto;padding:28px;background:#fff;border-radius:24px;box-shadow:0 8px 26px rgba(15,23,42,.08)}.brand{font-weight:950;font-size:21px}.muted{color:#667085;line-height:1.5}label{display:block;font-size:13px;font-weight:800;margin:16px 0 6px}input,textarea,select{width:100%;border:1px solid #dbe2ea;border-radius:13px;padding:13px;font:inherit}textarea{min-height:150px}.btn{width:100%;border:0;border-radius:14px;padding:14px;background:#0f172a;color:#fff;font:800 16px inherit;margin-top:20px;cursor:pointer}.status{margin-top:14px;line-height:1.5}.ok{color:#087f5b}.hidden{display:none!important}.back{display:block;text-align:center;margin-top:20px;color:#2563eb;text-decoration:none;font-weight:700}</style></head><body><main class="box"><div class="brand">HP · HandwerkPilot</div><h1>Wie können wir helfen?</h1><p class="muted">Schreib uns deine Frage. Wir melden uns per E-Mail bei dir zurück.</p><form id="form"><label>Name</label><input name="name" required autocomplete="name"><label>E-Mail</label><input name="email" type="email" required autocomplete="email"><label>Worum geht es?</label><select name="subject"><option>Allgemeine Frage</option><option>Registrierung & Anmeldung</option><option>Abo & Zahlung</option><option>Technisches Problem</option><option>Wunsch & Verbesserung</option></select><label>Nachricht</label><textarea name="message" required minlength="5" placeholder="Beschreibe kurz dein Anliegen."></textarea><input class="hidden" name="website" tabindex="-1" autocomplete="off"><button class="btn" type="submit">Nachricht senden</button></form><div id="status" class="status"></div><a class="back" href="/start.html">← Zur Startseite</a></main><script>const f=document.getElementById('form'),s=document.getElementById('status');f.addEventListener('submit',async e=>{e.preventDefault();s.className='status';s.textContent='Nachricht wird gesendet …';const data=Object.fromEntries(new FormData(f));try{const r=await fetch('/api/support',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}),d=await r.json();if(!r.ok)throw new Error(d.error||'Senden fehlgeschlagen.');f.reset();s.className='status ok';s.textContent='✓ Danke! Deine Nachricht ist bei uns eingegangen.'}catch(err){s.textContent=err.message||'Senden fehlgeschlagen.'}});</script></body></html>

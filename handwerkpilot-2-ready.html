<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>HandwerkPilot 2.0</title><style>html,body{margin:0;width:100%;height:100%;background:#f4f6f8;overflow:hidden}iframe{border:0;width:100%;height:100dvh;display:block;background:#f4f6f8}</style></head><body><iframe id="hp" src="/handwerkpilot-2-lexware.html?v=15" title="HandwerkPilot 2.0"></iframe><script>const f=document.getElementById('hp');function patch(){try{const w=f.contentWindow,d=w.document;if(!d||!d.body)return;const rename=()=>{d.querySelectorAll('#modalBody button').forEach(b=>{const t=(b.textContent||'').trim();if(t==='Öffnen'||t==='✏️ Öffnen / Bearbeiten')b.textContent='✏️ Bearbeiten';});};rename();if(!d.body.__hpObserver){const o=new MutationObserver(rename);o.observe(d.body,{childList:true,subtree:true});d.body.__hpObserver=o;}if(w.openCustomer&&!w.__hpCustomerPatched){const old=w.openCustomer;w.openCustomer=function(id){old(id);setTimeout(rename,0);setTimeout(rename,100)};w.__hpCustomerPatched=true;}}catch(e){}}f.addEventListener('load',()=>{patch();setTimeout(patch,500);setTimeout(patch,1500)});setInterval(patch,1500);</script></body></html>

<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>HandwerkPilot 2.0</title><style>html,body{margin:0;width:100%;height:100%;background:#f4f6f8;overflow:hidden}iframe{border:0;width:100%;height:100dvh;display:block;background:#f4f6f8}</style></head><body><iframe id="hp" src="/handwerkpilot-2-lexware.html?v=16" title="HandwerkPilot 2.0"></iframe><script>
const f=document.getElementById('hp');
function patch(){
  try{
    const w=f.contentWindow,d=w.document;if(!d||!d.body)return;
    if(!w.__hpRealEditorInstalled){
      w.eval(`
        window.hpRealEditDoc=function(id){
          const doc=documents.find(x=>x.id===id);if(!doc)return;
          const p=doc.payload||{};
          positions=JSON.parse(JSON.stringify(Array.isArray(p.positions)?p.positions:[]));
          if(!positions.length)positions=[{desc:'',qty:1,price:0}];
          currentDocType=doc.document_type;
          $('modalTitle').textContent=(doc.title||doc.document_type)+' '+(doc.document_number||'');
          const opts=customerOpts(p.customer_id||'');
          $('modalBody').innerHTML='<label>Kunde</label><select id="hpECustomer">'+opts+'</select><div class="form"><div><label>Nummer</label><input value="'+esc(doc.document_number||'')+'" readonly></div><div><label>Datum</label><input id="hpEDate" type="date" value="'+esc(p.date||'')+'"></div><div class="full"><label>Baustelle / Betreff</label><input id="hpESubject" value="'+esc(p.subject||'')+'"></div></div><h3>Positionen</h3><div id="hpEPositions"></div><button class="btn secondary" onclick="hpEAddPos()">+ Position</button><div class="sum" id="hpESum">'+money(doc.total_gross||0)+'</div><label>Notizen</label><textarea id="hpENote">'+esc(p.note||'')+'</textarea><div class="actions"><button class="btn primary" onclick="hpESaveDoc(\\''+doc.id+'\\')">💾 Änderungen speichern</button>'+(doc.document_type==='rechnung'&&typeof syncInvoiceLexware==='function'?'<button class="btn blue" onclick="syncInvoiceLexware(\\''+doc.id+'\\')">→ Lexware</button>':'')+'<button class="btn danger" onclick="deleteDoc(\\''+doc.id+'\\')">🗑 Löschen</button></div><div id="hpEStatus" class="status"></div>';
          $('modal').classList.remove('hidden');
          hpERenderPos();
          const head=document.querySelector('#modal .sheet-head');
          if(head){const back=head.querySelector('.homebtn');if(back){back.textContent='← Zurück';back.onclick=function(){closeModal();if(currentCustomer&&currentCustomer.id){openCustomer(currentCustomer.id)}else{showView('docs')}}}}
        };
        window.hpERenderPos=function(){const box=$('hpEPositions');if(!box)return;box.innerHTML=positions.map((p,i)=>'<div class="pos"><input class="wide" placeholder="Leistung" value="'+esc(p.desc||'')+'" oninput="positions['+i+'].desc=this.value"><input type="number" step=".01" value="'+Number(p.qty||0)+'" oninput="positions['+i+'].qty=Number(this.value);hpECalc()"><input type="number" step=".01" value="'+Number(p.price||0)+'" oninput="positions['+i+'].price=Number(this.value);hpECalc()"></div>').join('');hpECalc()};
        window.hpEAddPos=function(){positions.push({desc:'',qty:1,price:0});hpERenderPos()};
        window.hpECalc=function(){const clean=positions.filter(p=>String(p.desc||'').trim()||Number(p.price||0)!==0),net=clean.reduce((s,p)=>s+(Number(p.qty)||0)*(Number(p.price)||0),0),vat=Number(company.vat??19);if($('hpESum'))$('hpESum').textContent=money(net*(1+vat/100))};
        window.hpESaveDoc=async function(id){const doc=documents.find(x=>x.id===id);if(!doc)return;const cid=$('hpECustomer').value,c=customers.find(x=>x.id===cid),s=$('hpEStatus');if(!c){s.textContent='Bitte Kunde wählen.';return}const clean=positions.map(p=>({desc:String(p.desc||'').trim(),qty:Number(p.qty||0),price:Number(p.price||0)})).filter(p=>p.desc||p.price!==0),net=clean.reduce((a,p)=>a+p.qty*p.price,0),vat=Number(company.vat??19);const payload={...(doc.payload||{}),customer_id:cid,customer_name:c.name,customer_address:[c.street,c.city].filter(Boolean).join(', '),date:$('hpEDate').value,subject:$('hpESubject').value.trim(),note:$('hpENote').value.trim(),positions:clean};const r=await sb.from('documents').update({payload,total_net:net,total_vat:net*vat/100,total_gross:net*(1+vat/100)}).eq('id',id).select().single();if(r.error){s.textContent=r.error.message;return}documents=documents.map(x=>x.id===id?r.data:x);positions=clean.length?JSON.parse(JSON.stringify(clean)):[{desc:'',qty:1,price:0}];renderDocs();refresh();hpERenderPos();s.textContent='✓ Änderungen gespeichert';s.className='status ok'};
      `);
      w.__hpRealEditorInstalled=true;
    }
    const wire=()=>{
      d.querySelectorAll('#modalBody button').forEach(b=>{
        const t=(b.textContent||'').trim();
        const oc=b.getAttribute('onclick')||'';
        const m=oc.match(/openExistingDoc\(['\"]([^'\"]+)['\"]\)/);
        if((t==='Öffnen'||t==='✏️ Öffnen / Bearbeiten'||t==='✏️ Bearbeiten')&&m){
          b.textContent='✏️ Bearbeiten';
          const id=m[1];
          b.onclick=function(ev){ev.preventDefault();ev.stopPropagation();w.hpRealEditDoc(id)};
          b.removeAttribute('onclick');
        }
      });
    };
    wire();
    if(!d.body.__hpObserver){const o=new MutationObserver(wire);o.observe(d.body,{childList:true,subtree:true});d.body.__hpObserver=o;}
  }catch(e){console.log(e)}
}
f.addEventListener('load',()=>{patch();setTimeout(patch,300);setTimeout(patch,1000)});setInterval(patch,1200);
</script></body></html>

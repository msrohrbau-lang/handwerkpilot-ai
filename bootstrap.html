<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>HandwerkPilot</title><script src="/supabase-lite.js"></script></head><body style="margin:0;background:#f3f5f7"><div id="loading" style="font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif;padding:40px;text-align:center;color:#142033;font-weight:700">HandwerkPilot wird geladen …</div><script>(async()=>{try{let html=await (await fetch('/index.html?bootstrap=5',{cache:'no-store'})).text();html=html.replace('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></'+'script>','');const patch=`<script>
window.addEventListener('load',()=>{
  const params=new URLSearchParams(location.search);
  const status=document.getElementById('authStatus');
  if(params.get('registered')==='1'){
    if(typeof setAuthMode==='function') setAuthMode('login');
    status.textContent='Registrierung erfolgreich. Bitte E-Mail bestätigen und danach anmelden.';
    history.replaceState({},'',location.pathname);
  }else if(params.get('register_error')){
    if(typeof setAuthMode==='function') setAuthMode('signup');
    status.textContent=params.get('register_error');
    history.replaceState({},'',location.pathname);
  }

  window.submitAuth=async function(){
    const status=document.getElementById('authStatus');
    const btn=document.getElementById('authSubmit');
    const val=id=>(document.getElementById(id)?.value||'').trim();
    const email=val('authEmail'),password=val('authPass');
    const signup=!document.getElementById('signupFields').classList.contains('hidden');
    const company=val('regCompany'),name=val('regName');
    if(signup){
      if(!company||!name||!email||password.length<6){status.textContent='Bitte alle Felder ausfüllen. Passwort mindestens 6 Zeichen.';return;}
      status.textContent='Registrierung wird gestartet …';btn.disabled=true;
      const form=document.createElement('form');form.method='POST';form.action='/api/register';form.style.display='none';
      for(const [k,v] of Object.entries({email,password,company,name})){const i=document.createElement('input');i.name=k;i.value=v;form.appendChild(i)}
      document.body.appendChild(form);form.submit();return;
    }
    if(!email||!password){status.textContent='Bitte E-Mail und Passwort eingeben.';return;}
    status.textContent='Bitte warten …';btn.disabled=true;
    try{
      const r=await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'login',email,password})});
      const d=await r.json();if(!r.ok)throw new Error(d.error||'Anmeldung fehlgeschlagen.');
      if(!d.access_token)throw new Error('Anmeldung konnte nicht abgeschlossen werden.');
      const cfg=await (await fetch('/api/config',{cache:'no-store'})).json();
      const ref=(cfg.supabaseUrl.match(/^https:\/\/([^.]+)\.supabase\.co/)||[])[1]||'handwerkpilot';
      const sess={access_token:d.access_token,refresh_token:d.refresh_token,expires_in:d.expires_in,expires_at:d.expires_at||Math.floor(Date.now()/1000)+(d.expires_in||3600),token_type:d.token_type||'bearer',user:d.user};
      localStorage.setItem('sb-'+ref+'-auth-token',JSON.stringify(sess));location.reload();
    }catch(e){status.textContent=e.message;btn.disabled=false;}
  };

  window.requestPasswordReset=async function(){
    const email=(document.getElementById('authEmail')?.value||'').trim();
    const status=document.getElementById('authStatus');
    const btn=document.getElementById('forgotBtn');
    if(!email){status.textContent='Bitte zuerst deine E-Mail-Adresse eingeben.';return;}
    btn.disabled=true;status.textContent='Reset-Mail wird gesendet …';
    try{
      const cfg=await (await fetch('/api/config',{cache:'no-store'})).json();
      const redirect=location.origin+'/login';
      const r=await fetch(cfg.supabaseUrl+'/auth/v1/recover?redirect_to='+encodeURIComponent(redirect),{method:'POST',headers:{'Content-Type':'application/json','apikey':cfg.supabaseAnonKey,'Authorization':'Bearer '+cfg.supabaseAnonKey},body:JSON.stringify({email})});
      let d={};try{d=await r.json()}catch{}
      if(!r.ok)throw new Error(d.msg||d.message||d.error_description||('Fehler '+r.status));
      status.textContent='Passwort-Mail wurde gesendet. Bitte öffne den Link in der E-Mail.';
    }catch(e){status.textContent='Reset-Mail konnte nicht gesendet werden: '+e.message;}
    finally{btn.disabled=false;}
  };

  function hasPaidAccess(){
    try{
      const localTrial=!!org&&!!org.trial_ends_at&&new Date(org.trial_ends_at).getTime()>Date.now();
      const stripeTrial=!!subscription&&!!subscription.customer_id&&subscription.status==='trialing'&&(!subscription.current_period_end||new Date(subscription.current_period_end).getTime()>Date.now());
      const stripeActive=!!subscription&&!!subscription.customer_id&&subscription.status==='active';
      return localTrial||stripeTrial||stripeActive;
    }catch{return true;}
  }

  function removeGate(){const g=document.getElementById('hpBillingGate');if(g)g.remove();}
  function enforceBilling(){
    if(typeof session==='undefined'||!session||typeof org==='undefined'||!org)return;
    if(hasPaidAccess()){removeGate();return;}
    if(document.getElementById('hpBillingGate'))return;
    const g=document.createElement('div');g.id='hpBillingGate';g.style.cssText='position:fixed;inset:0;z-index:100;background:rgba(15,23,42,.82);display:flex;align-items:center;justify-content:center;padding:18px';
    g.innerHTML='<div style="background:#fff;max-width:480px;width:100%;border-radius:24px;padding:26px;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif;color:#142033"><div style="font-size:28px;font-weight:900;margin-bottom:10px">HandwerkPilot Pro</div><h2 style="margin:0 0 10px">Testphase beendet</h2><p style="color:#667085;line-height:1.5">Deine 14 Tage Testphase sind abgelaufen. Aktiviere HandwerkPilot Pro für 29,90 € pro Monat, um weiterzuarbeiten.</p><button id="hpCheckout" style="width:100%;border:0;border-radius:15px;background:#0f172a;color:#fff;font-weight:900;font-size:17px;padding:15px;margin-top:8px">Abo aktivieren</button><button id="hpLogout" style="width:100%;border:0;background:transparent;color:#667085;font-weight:800;padding:14px">Abmelden</button></div>';
    document.body.appendChild(g);
    document.getElementById('hpCheckout').onclick=()=>openCheckout();
    document.getElementById('hpLogout').onclick=()=>logout();
  }

  setInterval(enforceBilling,1200);
  setTimeout(enforceBilling,700);
});
</`+`script>`;html=html.replace('</body>',patch+'</body>');document.open();document.write(html);document.close()}catch(e){document.getElementById('loading').textContent='Laden fehlgeschlagen: '+e.message}})();</script></body></html>
